<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout — BLir</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/"><strong>BLir</strong><span>Suéteres navideños</span></a>
      <nav class="site-nav"><a href="/">← Seguir comprando</a></nav>
    </div>
  </header>

  <div class="wrap checkout-grid">
    <div>
      <div class="panel">
        <h2>Datos de contacto</h2>
        <div id="error" class="alert error" style="display:none"></div>
        <form id="checkoutForm">
          <div class="field">
            <label for="name">Nombre completo</label>
            <input id="name" name="name" autocomplete="name" required>
          </div>
          <div class="row">
            <div class="field">
              <label for="email">Correo</label>
              <input id="email" name="email" type="email" autocomplete="email" required>
            </div>
            <div class="field">
              <label for="phone">Teléfono / WhatsApp</label>
              <input id="phone" name="phone" type="tel" autocomplete="tel" required>
            </div>
          </div>

          <h2 style="margin-top:26px">Entrega</h2>
          <div class="field">
            <label for="method">Método de envío</label>
            <select id="method" name="method">
              <option value="paqueteria">Paquetería nacional — $149</option>
              <option value="local">Entrega local CDMX — $79</option>
              <option value="pickup">Recoger en tienda (CDMX) — Gratis</option>
            </select>
          </div>

          <div id="addressFields">
            <div class="field">
              <label for="street">Calle y número</label>
              <input id="street" name="street" autocomplete="street-address">
            </div>
            <div class="row">
              <div class="field">
                <label for="city">Ciudad / Municipio</label>
                <input id="city" name="city" autocomplete="address-level2">
              </div>
              <div class="field">
                <label for="state">Estado</label>
                <input id="state" name="state" autocomplete="address-level1">
              </div>
            </div>
            <div class="row">
              <div class="field">
                <label for="zip">Código postal</label>
                <input id="zip" name="zip" inputmode="numeric" autocomplete="postal-code">
              </div>
              <div class="field">
                <label for="notes">Referencias (opcional)</label>
                <input id="notes" name="notes">
              </div>
            </div>
          </div>

          <div class="field">
            <label for="coupon">Cupón</label>
            <input id="coupon" name="coupon" placeholder="BIENVENIDA">
          </div>

          <button class="btn block" id="payBtn" type="submit" style="margin-top:8px">
            Pagar y confirmar pedido
          </button>
          <p class="hint" style="text-align:center;margin-top:10px">
            Te llevaremos a Mercado Pago. No guardamos datos de tarjeta.
          </p>
        </form>
      </div>
    </div>

    <aside>
      <div class="panel summary">
        <h2>Resumen</h2>
        <div id="summary"></div>
      </div>
    </aside>
  </div>

  <script src="/assets/checkout.js"></script>
</body>
</html>
