<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — BLir</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body class="admin-body">
  <div id="login" style="display:none">
    <div class="login-box">
      <h1>BLir · Admin</h1>
      <p>Panel de la tienda. Acceso privado.</p>
      <div id="loginError" class="alert error" style="display:none"></div>
      <form id="loginForm">
        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn block" type="submit">Entrar</button>
      </form>
    </div>
  </div>

  <div id="app" style="display:none">
    <header class="admin-top">
      <div class="wrap">
        <a class="brand" href="/" target="_blank"><strong>BLir</strong><span>Admin</span></a>
        <nav>
          <button class="tab-btn active" data-tab="orders">Pedidos</button>
          <button class="tab-btn" data-tab="products">Productos</button>
          <button class="tab-btn" data-tab="inventory">Inventario</button>
          <button class="tab-btn" data-tab="reports">Reportes</button>
          <button class="tab-btn" id="logout">Salir</button>
        </nav>
      </div>
    </header>

    <main class="admin-main wrap">
      <div id="view"></div>
    </main>
  </div>

  <script src="/assets/admin.js"></script>
</body>
</html>
