[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# API: /api/* -> Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Páginas bonitas
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# El checkout ahora vive en el diálogo de la tienda
[[redirects]]
  from = "/checkout"
  to = "/"
  status = 301

[[redirects]]
  from = "/gracias"
  to = "/success.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
